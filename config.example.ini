; Copy this file to config.ini and put your own values.

[device]
; IP address of the ZKTeco device (device menu: Comm. > Ethernet). Give it a fixed IP in your router.
ip = 192.168.1.201
port = 4370

[bridge]
db_path = punches.db
; yes = read the punches stored on the device when bridge.py starts (slow with 90k punches)
; no  = start listening immediately (live punches only)
backfill = no
; only used when backfill = yes and the database is empty: how many past days to queue
initial_backfill_days = 0
; CSV with columns device_id,employee_code,name,role  (see mapping.example.csv)
mapping_file = mapping.csv

[output]
; dry_run = write the punches to a CSV file only (nothing is sent anywhere)
mode = dry_run
dry_run_file = dry_run_out.csv

[export]
; punches closer than this many hours belong to the same shift
shift_gap_hours = 13
; a shift LONGER than this many hours is exported but flagged in the review file (two shifts merged?)
max_shift_hours = 14
; a shift shorter than this many minutes is treated as a missing IN or OUT (reported, never guessed)
min_shift_minutes = 60
; start = a shift is listed under the day it STARTS (a night shift 23:00 -> 08:00 is in the sheet of the first day)
; end   = a shift is listed under the day it ENDS
shift_belongs_to = start
; ignore = skip device IDs that are not in mapping.csv, temporary = give them a temporary code
unknown_devices = ignore

[sheet]
; The layout of the exported Excel sheet. The defaults give a simple 3-column sheet.
; columns can be: code, type, type_name, datetime, date, blank  (one per column; "headers" must have the same count)
columns = code, type, datetime
headers = Employee Code, In/Out, Date and Time
; how the type name is written (only used by the column "type_name"), e.g. {kind} > {kind}  ->  IN > IN
type_name_format = {kind}
; Python date format: %Y-%m-%d %H:%M  ->  2026-03-12 07:58   |   %Y%m%d%H%M  ->  202603120758
date_format = %Y-%m-%d %H:%M
; 1 = headers in the first row. 2 = headers in the second row, and "note" (if set) is written in the last cell of row 1
header_row = 1
note =
sheet_name = Sheet1
